# Build & test the FRAMED multi-module Maven reactor (framed-core, -communicator,
# -streamer, -cdss, -app) on Java 21.
#
# NOTE: package publishing (deploy to GitHub Packages) is intentionally NOT wired here yet.
# It is postponed — see docs/reusable-framework-plan.md (Phases 5–6). When enabled, add a
# separate tag-triggered job with `permissions: packages: write` running `mvn -B deploy`.

name: Java CI with Maven

on:
  push:
    branches: [ "master", "feature/**", "pub/**" ]
  pull_request:

# Least privilege by default; the build job widens to contents:write only for the
# dependency-graph submission below.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required by the dependency-graph submission step

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java & Maven
        run: |
          java -version
          mvn -v

      # Builds every module and runs all module tests (verify spans the full reactor).
      - name: Build & test with Maven
        run: mvn -B verify --file pom.xml

      # Submit the dependency graph only on pushes to the default branch.
      - name: Update dependency graph
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6