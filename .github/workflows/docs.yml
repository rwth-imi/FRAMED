# Generates the aggregated Javadoc for the whole FRAMED reactor and publishes it to the
# gh-pages branch under docs/, which GitHub Pages serves at
# https://rwth-imi.github.io/FRAMED/docs/.

name: Deploy Javadoc

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write   # peaceiris/actions-gh-pages pushes to the gh-pages branch

jobs:
  javadoc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Install so the aggregate Javadoc can resolve sibling SNAPSHOT artifacts.
      - name: Build & install modules
        run: mvn -B -DskipTests install

      # javadoc:aggregate cannot combine the named module (framed-core's module-info)
      # with the unnamed domain modules ("named and unnamed modules" error). Remove the
      # module descriptor for the doc build only — this checkout is ephemeral and the
      # descriptor is untouched in the repository. Output: target/reports/apidocs.
      - name: Generate aggregated Javadoc
        run: |
          rm -f framed-core/src/main/java/module-info.java
          mvn -B javadoc:aggregate

      - name: Publish to gh-pages/docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/reports/apidocs
          destination_dir: docs
